# .github/workflows/test.yml
# 服务端测试门禁：每个 PR、每次进 main 都把 tests/ 下全部 jest 套件跑一遍。
#
# 【为什么加】（2026-10-19，App 2.63 发版后验证）
#   这个仓库此前只有 deploy.yml（push main → ssh 跑 deploy.sh：npm ci --omit=dev + check:config
#   + 装载自检，**不跑测试**）与 cert-expiry.yml。AGENTS.md 写着「合并前确认 npm test 全绿」，
#   但能不能做到全靠人记得在本地跑；而这台 Windows 开发机上单进程跑全量会中途 exit 127、
#   新 worktree 首跑会撞 beforeAll 5 秒超时 —— 本地跑一次全量要分七八批、十几分钟，最容易被省掉。
#   58b934c 的「96 个文件 1654/1654」那份证据，在这之前只有 10-19 那一轮本机重跑。
#
# 【只加 CI，不改部署】
#   deploy.yml 一个字没动：push main 照旧直接部署，这个 workflow 与它**并行**，不拦部署。
#   要不要让部署等测试绿（deploy 改 workflow_run / ruleset 把 jest 设成 required）是部署行为与
#   仓库设置的变化，要主人定。
#
# 【这台机器跑什么版本，为什么】
#   - Node 钉到生产那一个小版本：2026-10-19 在 ECS 上只读查过，`node -v` 与 `pm2 jlist` 里两个
#     ideahub-server 进程都是 v20.20.2（Ubuntu 22.04.5）。生产升 Node 时这里跟着改 —— 查法：
#     `ssh deploy@<ECS> node -v`。⚠ Node 20 已在 2026-04-30 停止维护；锁里的 geoip-lite@2.0.3
#     声明 engines >=24（npm ci 只告警不拦），生产在 20 上照样跑 —— 这里跑 20 正好替它作证。
#   - MongoDB 6.0.29（ubuntu2204 的官方构建）：mongodb-memory-server@8 默认的 5.0.19 只有
#     ubuntu2004 的包，要 libssl1.1，ubuntu 22.04 / 24.04 / 26.04 都没有 —— mongod 起不来、
#     67 个用到内存库的套件全红。不能上 7.0+：MMS 8 默认的 storageEngine 是 ephemeralForTest，
#     7.0 起被移除了（本机 8.2.6 实测：`Cannot start server with an unknown storage engine:
#     ephemeralForTest`），而 67 个套件都是不带参数的 `MongoMemoryServer.create()`。
#     MONGOMS_DISTRO 钉 ubuntu-22.04：ubuntu-latest 2026-10-19 起分批迁 26.04（到 11-19 迁完），
#     不钉的话 MMS 按 runner 的系统去拼 ubuntu2404 / ubuntu2604 的包名，6.0 没有这两种（下载 403）。
#     22.04 的构建在 24.04 与 26.04 的 runner 上都实跑过（PR #121 的两轮：96 个套件 1654 条全绿）。
#     本机 Windows 上跑的仍是 5.0.19（没设 MONGOMS_VERSION）—— 两边差一个大版本，测的是普通
#     CRUD 与聚合，不靠版本差异；真要对齐生产的 Atlas 版本，得先把 MMS 升到 9+（改依赖，另议）。
#   - Redis 6.0.16：与生产 `redis-server --version` 相同。没有 Redis 时 rateLimitRedis.spec.js
#     的三条用例会「跳过」（用例体里 `if (!available) return`，jest 照样记 passed）—— Redis 分支
#     零覆盖却是绿的。所以这里起一个 service，并在下面单设一步：拿到「Redis 真收到了限流器的命令」
#     这条正面证据才放行（见那一步的注释）。
#     镜像就从 Docker Hub 匿名拉，**别换成 public.ecr.aws 的同步源**（2026-10-19 换过一次、当场红了）：
#     - GitHub 官方文档（run-jobs-in-a-container）写明 GitHub 托管 runner 按 GitHub 与 Docker 的协议
#       不受 Docker Hub 拉取限额约束；PR #121 前三轮从 Docker Hub 拉都是几秒拉完。
#     - ECR Public 对匿名拉取按来源 IP 记每月 500GB 流量，而托管 runner 的出口 IP 是全世界共用的：
#       run 39350579062 拉 public.ecr.aws/docker/library/redis:6.0.16-alpine 连着三次
#       `toomanyrequests: Data limit exceeded`，job 在起容器那一步就死了。
#     （两边 6.0.16-alpine 的 manifest list 摘要逐字相同：sha256:0f0e2fa7…e1291f，镜像本身没区别。）
#     要是哪天改用自托管 runner，这条协议就不管用了 —— 那时再考虑 docker login 或自己的镜像源。

name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# PR 上连续 push 只留最后一轮（按 PR 的 ref 分组，新的一轮取消旧的）；进 main 的每个提交都要有
# 自己的结论，所以 push 按提交的 sha 各自成组，谁也不取消谁（几个提交前后脚进 main 就并排跑）。
# ⚠ 别把 push 也写回按 ref 分组：concurrency 缺省一个组里只留一轮在等，同组新排进来的会把**等待中**
#   的那一轮取消（cancel-in-progress: false 只保证不打断**正在跑**的）—— 连着合进两三个 PR 时，
#   中间那个提交就拿不到 test 结论，以后若让部署用 workflow_run 等 test 绿，那一次部署也不会触发。
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jest:
    # 不钉系统版本：上面那条 MONGOMS_DISTRO 已经让 mongod 与 runner 的系统脱钩，24.04 / 26.04 都验过
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        # 从 Docker Hub 拉、不换镜像源，理由见文件头「Redis 6.0.16」那一条
        image: redis:6.0.16-alpine
        ports:
          - 6379:6379
        # 等 Redis 真能回 PONG 再开跑：容器起来了但还没监听的那几百毫秒里，探测会判「不可用」
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MONGOMS_VERSION: "6.0.29"
      MONGOMS_DISTRO: "ubuntu-22.04"
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20.20.2"
          cache: npm

      # mongod 的包几十 MB（缓存压缩后约 40MB），每轮从 fastdl.mongodb.org 现下既慢又多一个会抖的外部依赖。
      # key 带版本与发行版：改了上面两个 env 就是另一份缓存，不会拿错二进制。
      - name: 缓存 mongod 二进制
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.MONGOMS_DISTRO }}-${{ env.MONGOMS_VERSION }}

      # 严格按 package-lock 装（含 devDependencies：jest / supertest / mongodb-memory-server）。
      # mongodb-memory-server 的 postinstall 会按上面的 MONGOMS_* 把 mongod 下好（缓存命中就跳过）。
      - run: npm ci

      # 先单独起一次 mongod 再跑套件：二进制缺了 / 起不来（缺动态库之类）时，在这一步就说清楚，
      # 而不是 67 个套件各自撞 beforeAll 的 5 秒超时、刷出几千行连带失败。
      - name: mongod 自检
        run: |
          node -e '
            const { MongoMemoryServer, MongoBinary } = require("mongodb-memory-server");
            (async () => {
              const t0 = Date.now();
              const bin = await MongoBinary.getPath();
              // 打出版本与 distmod（应为 ubuntu2204）：哪天换了版本 / 发行版，日志里一眼能对上
              const v = require("child_process").execFileSync(bin, ["--version"], { encoding: "utf8" });
              console.log("mongod binary:", bin);
              console.log(v.split("\n").filter((l) => /db version|distmod/.test(l)).join("\n"));
              const m = await MongoMemoryServer.create();
              console.log("mongod ok:", m.getUri(), `${Date.now() - t0} ms`);
              await m.stop();
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      # npm test = `jest --runInBand`（单进程串行：各套件各起一份内存库、改 process.env、
      # jest.resetModules，并行跑会互相踩）。--ci：快照缺失时失败而不是悄悄写一份新的。
      # --json --outputFile：留一份机器可读的结果给下面的汇总步；人读的输出照常打在日志里。
      # shell: bash = `bash -eo pipefail`，经 tee 之后的退出码仍是 jest 的。
      - name: jest
        shell: bash
        run: npm test -- --ci --json --outputFile=jest-results.json 2>&1 | tee jest.log

      # 光看 jest 绿不够：连不上 Redis 时 rateLimitRedis 的三条用例空跑、照样记 passed。这一步要拿到
      # **正面**证据才放行，下面任何一条不成立都红（几条一起报，不在第一条就停）：
      #   ① jest.log 与 jest-results.json 都在。npm ci / mongod 自检失败时 jest 根本没跑 —— 读不到就判红
      #      并说清。原来的写法在这种时候 grep 读不到文件、if 不成立，反而打出一句「连上了」的假话。
      #   ② 结果里有 rateLimitRedis.spec.js 这个套件、用例全 passed、一条都没跳过。
      #   ③ Redis 那一端真的收到过限流器的 EVAL（src/config/redis.js 的 INCR_SCRIPT —— 那就是 Redis 分支
      #      本身）；空跑时 Redis 只收到健康检查的 PING。这一条不靠 spec 里那句提示的措辞：有人改了
      #      console.warn 的字，③ 照样拦得住。限流器哪天不走 EVAL 了，这里会红，照着改判据就是。
      #   ④ 原来那道反面检查留着：日志里出现跳过提示就红（报出来的原因最直接）。
      - name: Redis 分支真的跑了
        if: success() || failure()
        shell: bash
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          if [ ! -f jest.log ] || [ ! -f jest-results.json ]; then
            echo "::error::没有 jest.log / jest-results.json：jest 没跑起来（多半是前面的 npm ci 或 mongod 自检失败了），Redis 分支有没有覆盖无从判断 —— 先看上面失败的那一步"
            exit 1
          fi
          fail=0
          node - <<'EOF' || fail=1
          const r = require("./jest-results.json");
          const s = r.testResults.find((t) => /[\\/]tests[\\/]rateLimitRedis\.spec\.js$/.test(t.name));
          if (!s) {
            console.log("::error::jest 结果里没有 tests/rateLimitRedis.spec.js 这个套件（删了 / 改名了 / 被排除了？）");
            process.exit(1);
          }
          const n = (st) => s.assertionResults.filter((a) => a.status === st).length;
          const notRun = s.assertionResults.length - n("passed") - n("failed");
          if (s.status !== "passed" || n("passed") === 0 || notRun > 0) {
            console.log(`::error file=tests/rateLimitRedis.spec.js::rateLimitRedis 套件不是全绿：status=${s.status}，passed ${n("passed")}、failed ${n("failed")}、没跑 ${notRun}`);
            process.exit(1);
          }
          console.log(`rateLimitRedis.spec.js：${n("passed")} 条 passed`);
          EOF
          stats=$(docker exec "$REDIS_CONTAINER" redis-cli INFO commandstats | tr -d '\r') || stats=""
          evals=$(printf '%s\n' "$stats" | sed -nE 's/^cmdstat_(eval|evalsha):calls=([0-9]+).*/\2/p' | awk '{ s += $1 } END { print s + 0 }')
          if [ "$evals" -lt 1 ]; then
            echo "::error file=tests/rateLimitRedis.spec.js::Redis 一条 EVAL 都没收到 —— 限流器的 Redis 分支没跑到。Redis 那一端的命令统计如下："
            printf '%s\n' "$stats" | grep '^cmdstat_' || echo "（读不到命令统计：docker exec 失败？）"
            fail=1
          else
            echo "Redis 收到限流器的 EVAL ${evals} 次"
          fi
          if grep -qF "[跳过] Redis 限流集成测试" jest.log; then
            echo "::error file=tests/rateLimitRedis.spec.js::Redis 没连上，rateLimitRedis 的三条用例只是空跑（记作 passed、Redis 分支零覆盖）"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "rateLimitRedis.spec.js 连上了 ${REDIS_TEST_URL}"

      - name: 汇总
        if: success() || failure()
        shell: bash
        run: |
          [ -f jest-results.json ] || { echo "没有 jest-results.json（jest 没跑完）" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const r = require("./jest-results.json");
          const dur = (s) => (s.endTime - s.startTime) / 1000;
          const total = (r.testResults.reduce((a, s) => Math.max(a, s.endTime), 0) - r.startTime) / 1000;
          const rel = (s) => s.name.split(/[\\/]tests[\\/]/).pop();
          console.log(`### jest：${r.success ? "全绿" : "有失败"}`);
          console.log("");
          console.log("| | 合计 | 通过 | 失败 | 跳过 | todo |");
          console.log("|---|---|---|---|---|---|");
          console.log(`| 套件（文件） | ${r.numTotalTestSuites} | ${r.numPassedTestSuites} | ${r.numFailedTestSuites}（其中没跑起来 ${r.numRuntimeErrorTestSuites}） | ${r.numPendingTestSuites} | — |`);
          console.log(`| 用例 | ${r.numTotalTests} | ${r.numPassedTests} | ${r.numFailedTests} | ${r.numPendingTests} | ${r.numTodoTests} |`);
          console.log("");
          console.log(`jest 墙钟约 ${total.toFixed(0)} 秒。最慢的 10 个套件：`);
          console.log("");
          const slow = [...r.testResults].sort((a, b) => dur(b) - dur(a)).slice(0, 10);
          for (const s of slow) console.log(`- ${rel(s)}：${dur(s).toFixed(1)} 秒`);
          const failed = r.testResults.filter((s) => s.status !== "passed");
          if (failed.length) {
            console.log("");
            console.log("没过的套件：");
            for (const s of failed) console.log(`- ${rel(s)}：${s.message.split("\n")[0].slice(0, 200)}`);
          }
          EOF
